[project]
name = "nq-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    # zoneinfo has no system IANA database on Windows, and minimal Linux
    # containers often ship without one either. SessionCalendar cannot
    # resolve America/New_York without it.
    "tzdata>=2024.1",
]

[project.optional-dependencies]
# Live trading only. Kept out of the base install so a replay or a backtest
# needs neither a market-data SDK nor an HTTP client, and so the test suite
# that covers steps 1-10 runs without them.
live = [
    "databento>=0.83",
    "aiohttp>=3.9",
]
dev = [
    "aiohttp>=3.9",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nq_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
# Deliberately py310, not py312: this only controls which syntax-modernization
# (UP) suggestions ruff makes, not the minimum interpreter the code runs on
# (see [project] requires-python). The test suite must run on Python 3.10, so
# this stays at py310 to avoid ruff flagging the 3.10-compatible spellings the
# plan requires (e.g. `class Direction(str, Enum)`, `timezone.utc`,
# `except asyncio.TimeoutError`) as needing 3.12-only replacements. Do not
# "correct" this to match requires-python.
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/nq_agent"]
