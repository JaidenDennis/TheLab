[project]
name = "desk-brain"
version = "0.1.0"
description = "Trading Desk background worker: engine state, tools, buddy agent, watcher, grader"
requires-python = ">=3.12"
dependencies = [
    "nq-agent",
    "redis>=5.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "anthropic>=0.40",
    "supabase>=2.10",
    "aiohttp>=3.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "databento>=0.83",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "fakeredis>=2.23",
    "ruff>=0.5",
]

[tool.uv.sources]
nq-agent = { path = "../..", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/desk_brain"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
